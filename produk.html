<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <title>Produk - D'exter Fruit</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f4f4f4, #d4d4d4);
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            width: 80%;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .produk-item,
        nav,
        .cta,
        h1,
        footer {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: fadeIn 1s ease-in-out forwards;
        }

        body.dark-mode nav {
            background: rgb(3, 70, 31)
        }

        nav {
            background: #208454
        }

        h1 {
            color: white;
        }
    </style>
</head>

<body>
    <div class="background"></div>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav text-center d-flex mx-auto">
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="index.html">Beranda</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="produk.html">Produk</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="tentang.html">Tentang</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <br>
    <div class="navbar d-flex mx-auto">
        <div class="toggle-switch" id="toggleDarkMode">
            <div class="toggle-circle"></div>
        </div>
    </div>
    <h1 class="text-center text-white">Produk</h1>
    <div class="container" id="mainContent">
        <div class="container mt-5">
            <input type="text" id="searchInput" placeholder="Cari Buah..." onkeyup="cariBuah()"
                class="form-control mb-4">
            <div id="buahList" class="buah-list"></div>
            <div class="cart-icon" id="cartIcon">
                <span class="fas fa-shopping-cart"></span>
                <span class="cart-count" id="cartCount">0</span>
            </div>
            <div class="keranjang-container" id="keranjangContainer">
                <div class="keranjang-header">Keranjang</div>
                <div id="keranjangList"></div>
                <button id="checkoutButton" class="btn btn-primary mt-3" data-bs-toggle="modal"
                    data-bs-target="#modalKonfirmasi">Checkout
                </button>
            </div>
        </div>
    </div>



    <!-- Modal Konfirmasi Pembelian -->
    <div class="modal fade" id="modalKonfirmasi" tabindex="-1" aria-labelledby="modalKonfirmasiLabel"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalKonfirmasiLabel">Konfirmasi Pembelian</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p id="totalHargaModal"></p>
                </div>
                <div class="modal-footer">
                    <button id="iyaButton" class="btn btn-success">Iya</button>
                    <button id="tidakButton" class="btn btn-danger" data-bs-dismiss="modal">Tidak</button>
                </div>
            </div>
        </div>
    </div>


    <footer>
        <p>&copy; 2025 D'exter Fruit.</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
